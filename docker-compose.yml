version: '3'
services:
  mongodb:
    image: mongo:latest
    container_name: mongodb-minbar
    restart: always
    command:
      - mongod
      - --auth
    environment:
      MONGO_INITDB_ROOT_USERNAME: unnimaya
      MONGO_INITDB_ROOT_PASSWORD: 1234
    ports:
      - '30000:27017'
    volumes:
      - mongodb_data:/data/db
    # Ensure correct permissions
    user: '999:999'

  mongo-express:
    image: mongo-express
    container_name: mongo-minbar-express
    restart: always
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb-minbar
      ME_CONFIG_MONGODB_ADMINUSERNAME: unnimaya
      ME_CONFIG_MONGODB_ADMINPASSWORD: 1234
      ME_CONFIG_MONGODB_URL: mongodb://unnimaya:1234@mongodb-minbar:27017/?directConnection=true
    ports:
      - '8082:8081'
    depends_on:
      - mongodb

  redis:
    image: redis:alpine
    container_name: redis-minbar
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  mongodb_data:
  redis_data:


